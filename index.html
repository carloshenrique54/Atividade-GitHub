<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>

    <link rel="stylesheet" href="netflixstyles.css">
</head>

<body>

    <header class="showcase">

        <div class="showcase-top">
            <p>Best of the Week</p>
        </div>

        <nav>
            <a href="#" class="btn btn-m">Sign in</a>
        </nav>

        <div class="showcase-content">
            <h1>Muitos filmes, séries e mais...</h1>

            <div class="search-box">
                <input type="text" placeholder="Email address">
                <a href="#" class="btn btn-x1">TRY IT NOW</a>
            </div>

            <div class="theme-buttons">
                <button onclick="mudarCor('#e50914')">Vermelho</button>
                <button onclick="mudarCor('#00ff88')">Verde</button>
                <button onclick="mudarCor('#0099ff')">Azul</button>
                <button onclick="mudarCor('#a020f0')">Roxo</button>
            </div>
        </div>

    </header>

    <div class="enjoy-tv">
        <div>
            <h2>Aproveite na sua TV.</h2>
            <p>Watch on your smart-TV, PlayStation, Xbox e mais.</p>
        </div>

        <img src="https://t.ctcdn.com.br/hxMIOa4911i56IHic6sETQtHCBg=/1270x714/smart/i541471.jpeg">
    </div>

    <div class="Watch-offline">
        <div>
            <h2>Download seus shows.</h2>
            <p>Assista offline quando quiser.</p>
        </div>

        <img src="https://play-lh.googleusercontent.com/4DOuvVtWKp_dcvPvueS-g3tUQw08AtSgumH1b7iNlX4YkcwUyBcAsKWIljaDjxT3hKc=w526-h296-rw">
    </div>

    <footer class="page-down">
        <p>Netflix Clone - Carlos Henrique</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
